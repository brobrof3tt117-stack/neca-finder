name: Update NECA listings

on:
  # The hourly start comes from timer.yml (it has its own backup schedule),
  # so there is no schedule here. That avoids two updates every hour.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install helper library
        run: pip install requests==2.32.3

      - name: Check eBay and the NECA store for sealed figures
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SHIP_TO_ZIP: ${{ vars.SHIP_TO_ZIP }}
        run: python updater/update.py

      - name: Keep the hourly schedule switched on and save pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/last-run-day.txt updater/figure-images.json updater/listing-photos.json updater/shipping-cache.json
          git commit -m "Save figure pictures and shipping prices" || echo "Nothing new to save"
          git push || echo "Skipped save this time"

      - name: Prepare website
        uses: actions/configure-pages@v5

      - name: Package website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Publishing is its own job, as GitHub recommends. GitHub sometimes says the
  # packaged website "was not found" right after it was made, so if the first
  # try fails it waits 30 seconds and tries once more.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Publish website (second try)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
