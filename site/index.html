<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NECA Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@500;700&family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Libre+Franklin:wght@400;600;700&family=Michroma&family=Saira+Stencil+One&family=Share+Tech+Mono&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body data-page="home" data-theme="alien">
<nav class="tabs" id="tabs" aria-label="Figure lines"></nav>
<header class="hero" id="hero">
  <div class="hero-art" aria-hidden="true"></div>
  <div class="wrap hero-inner">
    <h1 id="title">NECA Finder</h1>
    <p class="tagline" id="tagline">New, sealed NECA figures for sale right now.</p>
    <p class="status" id="updated">Loading listings...</p>
  </div>
</header>
<main class="wrap">
  <div id="banner"></div>
  <div class="tools">
    <label class="sr" for="q">Search figures</label>
    <input class="search" id="q" type="search" placeholder="Search this line, like hicks or tech noir" autocomplete="off">
    <label class="check"><input type="checkbox" id="onlyForSale"> Only show figures for sale</label>
  </div>
  <div id="sections"></div>
</main>
<footer class="wrap foot" id="foot"></footer>
<script src="app.js?v=2"></script>
</body>
</html>
